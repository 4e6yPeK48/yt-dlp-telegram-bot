[project]
name = "yt-dlp-telegram-bot"
version = "0.1.0"
description = "Telegram bot using aiogram + yt-dlp"
authors = [
    {name = "matvey",email = "mmchupryna@edu.hse.ru"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiogram (>=3.23.0,<4.0.0)",
    "yt-dlp (>=2025.12.8,<2026.0.0)",
    "telethon (>=1.42.0,<2.0.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"
